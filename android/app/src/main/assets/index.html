<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#4338CA">
  <title>Languago</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="splash">
    <div class="splash-logo">🌿</div>
    <h1 class="splash-title">Languago</h1>
    <p class="splash-sub">Dil öğrenme koçu</p>
    <div class="splash-dev">
      <div class="splash-name">Samet Tıraşoğlu</div>
      <div class="splash-mail">tirasoglusamet@gmail.com</div>
    </div>
    <div class="splash-tap">Başlamak için dokun</div>
  </div>

  <div id="app">
    <header id="topbar">
      <button id="backBtn" class="icon-btn hidden" aria-label="Geri">←</button>
      <div id="topTitle">
        <span class="logo-dot"></span>
        <h1 id="titleText">Languago</h1>
      </div>
      <button id="settingsBtn" class="icon-btn" aria-label="Ayarlar">⚙️</button>
    </header>

    <main id="content"></main>

    <nav id="tabbar">
      <button class="tab" data-tab="home">
        <span class="tab-ico">🏠</span><span class="tab-label">Ana Sayfa</span>
      </button>
      <button class="tab" data-tab="sets">
        <span class="tab-ico">📚</span><span class="tab-label">Kelimeler</span>
      </button>
      <button class="tab" data-tab="grammar">
        <span class="tab-ico">📖</span><span class="tab-label">Dilbilgisi</span>
      </button>
      <button class="tab" data-tab="review">
        <span class="tab-ico">🔁</span><span class="tab-label">Tekrar</span>
      </button>
      <button class="tab" data-tab="search">
        <span class="tab-ico">🔍</span><span class="tab-label">Ara</span>
      </button>
      <button class="tab" data-tab="stats">
        <span class="tab-ico">📊</span><span class="tab-label">İlerleme</span>
      </button>
    </nav>
  </div>

  <div id="modal" class="hidden"></div>
  <div id="toast" class="hidden"></div>

  <script src="words.js"></script>
  <script src="idioms.js"></script>
  <script src="achievements.js"></script>
  <script src="grammar_a1.js"></script>
  <script src="grammar_a2.js"></script>
  <script src="grammar_b1.js"></script>
  <script src="grammar_b2.js"></script>
  <script src="grammar_mcq_a1.js"></script>
  <script src="grammar_mcq_a2.js"></script>
  <script src="grammar_mcq_b1.js"></script>
  <script src="grammar_mcq_b2.js"></script>
  <script src="readings_a1.js"></script>
  <script src="readings_a2.js"></script>
  <script src="readings_b1.js"></script>
  <script src="readings_b2.js"></script>
  <script src="readings_c1.js"></script>
  <script src="readings_c2.js"></script>
  <script src="readings_ielts.js"></script>
  <script src="readings_toefl.js"></script>
  <script src="readings_yds.js"></script>
  <script src="readings_yokdil.js"></script>
  <script src="readings_gre.js"></script>
  <script src="app.js"></script>
</body>
</html>
